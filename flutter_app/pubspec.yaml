name: transportfiles
description: "Local file transfer for Android, Windows, Linux and macOS."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  crypto: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  file_picker: ^11.0.3
  super_clipboard: ^0.9.1
  share_plus: ^12.0.2
  ffi: ^2.2.0
  unorm_dart: ^0.3.3
  http2: ^2.3.1
  image: ^4.12.0
  # 0.6.1 omits Apple x64 assembly. Pin the reviewed fix until it is released:
  # https://github.com/google/webcrypto.dart/pull/448
  webcrypto:
    git:
      url: https://github.com/google/webcrypto.dart.git
      ref: e50fcce3d0c30627b11ffc74eb964b1073d42620

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  protoc_plugin: ^25.1.0

dependency_overrides:
  # grpc 5.2 still constrains http2 to 2.x. This upstream revision adds the
  # connection receive window needed for throughput; compatibility is tested
  # against Java and Dart on every desktop platform in CI.
  http2:
    git:
      url: https://github.com/dart-lang/http.git
      ref: 23f8574cdfce93c3bb0c6d83d92167d92b9824d5
      path: pkgs/http2


flutter:

  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/transfer_active.gif
