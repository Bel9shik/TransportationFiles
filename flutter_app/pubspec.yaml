name: transportfiles
description: "Local file transfer for Android, Windows, Linux and macOS."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  crypto: ^3.0.8
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  file_picker: ^11.0.3
  super_clipboard: ^0.9.1
  share_plus: ^12.0.2
  ffi: ^2.2.0
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  protoc_plugin: ^25.1.0


flutter:

  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/transfer_active.gif




