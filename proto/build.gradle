plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.5'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.8' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.73.0' } }
    generateProtoTasks {
        all().configureEach {
            builtins { java { option 'lite' } }
            plugins { grpc { option 'lite' } }
        }
    }
}
dependencies {
    api 'io.grpc:grpc-protobuf-lite:1.73.0'
    api 'io.grpc:grpc-stub:1.73.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
