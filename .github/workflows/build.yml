name: Cross-platform build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TRANSPORT_DISCOVERY_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 xvfb
      - name: Test and package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew :core:test :app:test :app:distZip :app:packageApp
      - name: Test and package (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew :core:test :app:test :app:distZip :app:packageApp
      - name: Launch packaged application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_package.py
      - name: Launch packaged application (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/smoke_package.py
      - name: Build Windows EXE installer
        if: runner.os == 'Windows'
        run: ./gradlew.bat :app:packageWindowsInstaller
      - name: Install and launch Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem app/build/installer/*.exe)
          if ($installer.Count -ne 1) { throw 'Expected one EXE installer' }
          $log = Join-Path $env:RUNNER_TEMP 'TransportationFiles-install.log'
          $process = Start-Process $installer[0].FullName -ArgumentList '/quiet', '/norestart', '/L*v', "`"$log`"" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            Get-Content $log
            throw "Installer failed: $($process.ExitCode)"
          }
          python scripts/smoke_package.py $env:LOCALAPPDATA
          if ($LASTEXITCODE -ne 0) { throw 'Installed application failed to launch' }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'TransportationFiles/TransportationFiles.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'TransportationFiles.lnk'
          if (!(Test-Path $menu) -or !(Test-Path $desktop)) { throw 'Application shortcuts missing' }
          Move-Item $installer[0].FullName app/build/installer/TransportationFiles-Windows-X64-Setup.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TransportationFiles-Windows-X64-Setup
          path: app/build/installer/*-Setup.exe
      - name: Preserve executable permissions in the app image
        shell: bash
        run: tar -czf TransportationFiles-${{ runner.os }}-${{ runner.arch }}.tar.gz -C app/build/package .
      - uses: actions/upload-artifact@v4
        with:
          name: TransportationFiles-${{ runner.os }}-${{ runner.arch }}
          path: TransportationFiles-*.tar.gz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-reports-${{ runner.os }}-${{ runner.arch }}
          path: '**/build/reports/tests/'
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew -Pandroid=true :android:assembleDebug :android:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TransportationFiles-Android-debug
          path: android/build/outputs/apk/debug/*.apk
