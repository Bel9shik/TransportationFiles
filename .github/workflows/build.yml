name: Windows throughput probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ilammy/setup-nasm@v1
      - working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Candidate analysis and tests
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test
      - name: Build Java baseline
        shell: bash
        run: ./gradlew :core:prepareTransferBenchmark
      - name: Build before and after AOT bundles
        shell: bash
        run: |
          git fetch origin 514b144825bfd9758bda30a12f7c28429d71d8ab
          git show 514b144825bfd9758bda30a12f7c28429d71d8ab:flutter_app/lib/transfer/transfer.dart > flutter_app/lib/transfer/transfer.dart
          cd flutter_app
          dart build cli --target=tool/benchmark.dart --output=build/before
          git restore lib/transfer/transfer.dart
          dart build cli --target=tool/benchmark.dart --output=build/prepared
      - name: Compare unchanged control before and after candidate
        shell: bash
        run: |
          for variant in before prepared before; do
            stamp=$(date +%s)
            flutter_app/build/$variant/bundle/bin/benchmark.exe components
            python scripts/benchmark_transfer.py --classpath core/build/benchmark-classpath.txt --dart-aot flutter_app/build/$variant/bundle/bin/benchmark.exe --output transfer-$variant-$stamp.json --warmups 3 --runs 9 --cross
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-throughput-probe
          path: transfer-*.json
