name: Windows throughput probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ilammy/setup-nasm@v1
      - working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Candidate analysis and tests
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test
      - name: Build Java baseline
        shell: bash
        run: ./gradlew :core:prepareTransferBenchmark
      - name: Build before and after AOT bundles
        shell: bash
        run: |
          git fetch origin e5d0926bbb677e8cfd4a6cb5423c272687c59e8c
          git show e5d0926bbb677e8cfd4a6cb5423c272687c59e8c:flutter_app/lib/transfer/bounded_grpc.dart > flutter_app/lib/transfer/bounded_grpc.dart
          cd flutter_app
          dart build cli --target=tool/benchmark.dart --output=build/before
          python -c "from pathlib import Path; p=Path('lib/transfer/bounded_grpc.dart'); p.write_text(p.read_text().replace('streamWindowSize: 1024 * 1024','streamWindowSize: 4 * 1024 * 1024').replace('connectionWindowSize: 4 * 1024 * 1024','connectionWindowSize: 16 * 1024 * 1024'))"
          dart build cli --target=tool/benchmark.dart --output=build/window4
          git restore lib/transfer/bounded_grpc.dart
          dart build cli --target=tool/benchmark.dart --output=build/window16
      - name: Compare unchanged control before and after candidate
        shell: bash
        run: |
          for variant in before window4 window16 before; do
            stamp=$(date +%s)
            flutter_app/build/$variant/bundle/bin/benchmark.exe components
            python scripts/benchmark_transfer.py --classpath core/build/benchmark-classpath.txt --dart-aot flutter_app/build/$variant/bundle/bin/benchmark.exe --output transfer-$variant-$stamp.json --warmups 3 --runs 9 --cross
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-throughput-probe
          path: transfer-*.json
