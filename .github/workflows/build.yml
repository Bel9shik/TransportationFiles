name: macOS Intel repeated startup probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download previously validated Intel package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41418535620 -n TransportationFiles-Native-macOS-X64 -D probe-artifact
      - name: Repeated startup with native thread sampling on failure
        run: |
          mkdir probe-package
          tar -xzf probe-artifact/TransportationFiles-macOS-X64.tar.gz -C probe-package
          python3 scripts/measure_startup.py "$PWD/probe-package/TransportationFiles.app/Contents/MacOS/TransportationFiles" --runs 20 --max-seconds 15 --require-ready --diagnostics-dir startup-diagnostics > probe-startup.json
      - name: Summarize only app crash signal and native function names
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,time
          time.sleep(3)
          summaries=[]
          for p in (Path.home()/'Library/Logs/DiagnosticReports').glob('TransportationFiles*.ips'):
              try:
                  data=json.loads(p.read_text().split('\n',1)[1])
                  exception=data.get('exception',{})
                  termination=data.get('termination',{})
                  frames=data.get('threads',[])[data.get('faultingThread',0)].get('frames',[])
                  summaries.append({
                      'exception': {k:exception[k] for k in ('type','signal') if k in exception},
                      'termination': {k:termination[k] for k in ('namespace','code','indicator') if k in termination},
                      'functions': [f['symbol'][:300] for f in frames[:30] if 'symbol' in f],
                  })
              except (ValueError,IndexError,KeyError):
                  summaries.append({'error':'Could not parse app crash summary'})
          out=Path('startup-diagnostics');out.mkdir(exist_ok=True)
          (out/'crash-summary.json').write_text(json.dumps(summaries,indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-intel-startup-probe
          path: |
            probe-startup.json
            startup-diagnostics/
