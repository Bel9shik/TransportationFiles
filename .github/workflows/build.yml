name: Windows throughput probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ilammy/setup-nasm@v1
      - working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Reusable-read candidate analysis and full tests
        working-directory: flutter_app
        run: |
          flutter analyze
          flutter test
      - name: Verify isolated synchronous upload variant
        working-directory: flutter_app
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          p = Path('lib/transfer/upload_flow.dart')
          s = p.read_text()
          before = 'final _controller = StreamController<h2.StreamMessage>();'
          assert s.count(before) == 1
          p.write_text(s.replace(before, 'final _controller = StreamController<h2.StreamMessage>(sync: true);'))
          PYTHON
          flutter test test/upload_flow_test.dart
          git restore lib/transfer/upload_flow.dart
      - name: Build Java baseline
        shell: bash
        run: ./gradlew :core:prepareTransferBenchmark
      - name: Build pinned control and reusable-read AOT variants
        shell: bash
        run: |
          git fetch origin c8ad2501cf398b83aa389e8a1b5fa24f4af1cd85
          git show c8ad2501cf398b83aa389e8a1b5fa24f4af1cd85:flutter_app/lib/transfer/prepared_file_source.dart > flutter_app/lib/transfer/prepared_file_source.dart
          (cd flutter_app && dart build cli --target=tool/benchmark.dart --output=build/before)
          git restore flutter_app/lib/transfer/prepared_file_source.dart
          (cd flutter_app && dart build cli --target=tool/benchmark.dart --output=build/reusable)
          python - <<'PYTHON'
          from pathlib import Path
          p = Path('flutter_app/lib/transfer/upload_flow.dart')
          s = p.read_text()
          before = 'final _controller = StreamController<h2.StreamMessage>();'
          assert s.count(before) == 1
          p.write_text(s.replace(before, 'final _controller = StreamController<h2.StreamMessage>(sync: true);'))
          PYTHON
          (cd flutter_app && dart build cli --target=tool/benchmark.dart --output=build/reusable_sync)
          git restore flutter_app/lib/transfer/upload_flow.dart
      - name: Compare unchanged controls around reusable-read candidates
        shell: bash
        run: |
          for variant in before reusable reusable_sync before; do
            stamp=$(date +%s)
            python scripts/benchmark_transfer.py --classpath core/build/benchmark-classpath.txt --dart-aot flutter_app/build/$variant/bundle/bin/benchmark.exe --output transfer-$variant-$stamp.json --warmups 3 --runs 9 --cross
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-throughput-probe
          path: transfer-*.json
