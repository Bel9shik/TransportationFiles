name: macOS Intel untraced startup core probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download previously validated Intel package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41418535620 -n TransportationFiles-Native-macOS-X64 -D probe-artifact
      - name: Capture own ephemeral app crash as safe offline function summaries
        timeout-minutes: 4
        run: |
          mkdir probe-package
          tar -xzf probe-artifact/TransportationFiles-macOS-X64.tar.gz -C probe-package
          export PROBE_EXECUTABLE="$PWD/probe-package/TransportationFiles.app/Contents/MacOS/TransportationFiles"
          python3 scripts/run_startup_debugger.py --core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-intel-startup-core-summary
          path: |
            startup-diagnostics/core-runs.json
            startup-diagnostics/offline-core.json
