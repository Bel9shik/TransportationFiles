plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
javafx {
    version = '21.0.7'
    modules = ['javafx.controls', 'javafx.fxml']
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
dependencies {
    implementation project(':core')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
}
application { mainClass = 'kardash.project.app.Launcher' }
// jpackage includes the JRE and JavaFX natives for the build host.
tasks.register('packageApp', Exec) {
    dependsOn installDist
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    doFirst {
        def output = layout.buildDirectory.dir('package').get().asFile
        delete output
        commandLine new File(launcher.get().metadata.installationPath.asFile, 'bin/jpackage').absolutePath,
                '--type', 'app-image', '--name', 'TransportationFiles',
                '--input', layout.buildDirectory.dir('install/app/lib').get().asFile.absolutePath,
                '--main-jar', tasks.jar.archiveFile.get().asFile.name,
                '--main-class', application.mainClass.get(),
                '--dest', output.absolutePath
    }
}

test { useJUnitPlatform() }
